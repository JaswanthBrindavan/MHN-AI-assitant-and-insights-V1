# Railway config for the EMBEDDINGS service (davi-embeddings).
#
# Same repo, second service: on the embeddings service set
#   Settings → Config-as-code → path = railway.embeddings.toml
# Without this, the service inherits the repo-root railway.toml — which pins
# the API's Dockerfile and a /health healthcheck Ollama doesn't serve, and
# config-as-code OVERRIDES dashboard settings (the same shared-config trap
# mhn-ai documents in its own railway.toml).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.ollama"

[deploy]
# Ollama answers 200 "Ollama is running" on GET / — that's its healthcheck.
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# ONE required service variable:  PORT=11434
# Railway's healthcheck probes the port in the PORT variable, and it
# auto-generates PORT when unset — but Ollama ignores PORT and listens on
# 11434 (baked OLLAMA_HOST). Without PORT=11434 the healthcheck probes an
# unbound port and every deploy fails with "service unavailable".
#
# Everything else is baked into the image (OLLAMA_HOST, OLLAMA_KEEP_ALIVE,
# the model). The service must have NO public domain (private networking only:
# http://<service-name>.railway.internal:11434/v1).
