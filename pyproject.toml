[project]
name = "davi-health-ai"
version = "0.1.0"
description = "Davi Health AI backend — deterministic family-risk insights + clinical chatbot chassis (decision support, never diagnosis)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "pyright>=1.1.360",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pyright]
include = ["app", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pg: tests that require a real PostgreSQL database (deselect with '-m \"not pg\"')",
]
addopts = "-m 'not pg'"

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]
